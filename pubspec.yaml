name: task_check
description: "TaskCheck - Aplicación de escritorio para gestión personal de tareas con widget flotante"
publish_to: 'none'

version: 1.0.8+8

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  drift: ^2.35.3
  sqlite3: ^3.5.2
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.1
  window_manager: ^0.5.2
  screen_retriever: ^0.2.2
  shared_preferences: ^2.5.6
  uuid: ^4.6.0
  intl: ^0.20.3
  fl_chart: ^1.3.0
  google_fonts: ^9.0.0
  http: ^1.2.2
  flutter_local_notifications: ^22.3.3
  file_picker: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
